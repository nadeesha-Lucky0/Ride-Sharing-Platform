spring.application.name=account-service
server.port=${SERVER_PORT:8081}

# ==============================================================================
# Member 1: MongoDB Configuration (Account Service)
# ==============================================================================
# Option 1: Local MongoDB (Default)
# spring.data.mongodb.uri=mongodb://localhost:27017/account_db
#
# Option 2: Docker Container (when running via docker-compose)
# spring.data.mongodb.uri=mongodb://admin:password@mongodb:27017/account_db?authSource=admin
#
# Option 3: MongoDB Atlas Cloud Cluster (Paste your Atlas connection link here)
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/account_db?retryWrites=true&w=majority
# ==============================================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/account_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

