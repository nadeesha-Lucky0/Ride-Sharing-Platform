services:
  # -------------------------------------------------------------
  # MongoDB Databases
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: ridelink-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db
    networks:
      - ridelink-net

  # -------------------------------------------------------------
  # Member 1: Account Service (Port 8081)
  # -------------------------------------------------------------
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: ridelink-account-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      # MongoDB Atlas URI
      - SPRING_DATA_MONGODB_URI=mongodb+srv://nadeeshalakshan200108_db_user:Nadeesha200108@account-service.lgsyltg.mongodb.net/account_db?retryWrites=true&w=majority
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION=86400000
    networks:
      - ridelink-net

  # -------------------------------------------------------------
  # Member 2: Driver Service (Port 8082)
  # -------------------------------------------------------------
  driver-service:
    build:
      context: ./driver-service
      dockerfile: Dockerfile
    container_name: ridelink-driver-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      # Docker MongoDB container URI (or replace with MongoDB Atlas link: mongodb+srv://<user>:<pwd>@cluster0.mongodb.net/driver_db)
      - SPRING_DATA_MONGODB_URI=mongodb://admin:password@mongodb:27017/driver_db?authSource=admin
    depends_on:
      - mongodb
    networks:
      - ridelink-net

  # -------------------------------------------------------------
  # Member 3: Ride Service (Port 8083)
  # -------------------------------------------------------------
  ride-service:
    build:
      context: ./ride-service
      dockerfile: Dockerfile
    container_name: ridelink-ride-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      # MongoDB Atlas URI
      - SPRING_DATA_MONGODB_URI=mongodb+srv://growhighmarketing22_db_user:Growhigh@1019@ridemanagementservice.pcw5epw.mongodb.net/ride_db?retryWrites=true&w=majority&appName=RideManagementService
      - SERVICES_ACCOUNT_URL=http://account-service:8081
      - SERVICES_DRIVER_URL=http://driver-service:8082
      - SERVICES_PAYMENT_URL=http://payment-service:8084
    networks:
      - ridelink-net

  # -------------------------------------------------------------
  # Member 4: Payment Service (Port 8084)
  # -------------------------------------------------------------
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: ridelink-payment-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      # MongoDB Atlas URI
      - SPRING_DATA_MONGODB_URI=mongodb+srv://it24102198_db_user:UwQUvrcWlIC62uep@payment-fare.a8vzjtg.mongodb.net/payment_db?retryWrites=true&w=majority&appName=Payment-Fare
    networks:
      - ridelink-net

networks:
  ridelink-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
