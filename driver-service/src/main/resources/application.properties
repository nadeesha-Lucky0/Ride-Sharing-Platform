spring.application.name=driver-service
server.port=${SERVER_PORT:8082}

# ==============================================================================
# Member 2: MongoDB Configuration (Driver Service)
# ==============================================================================
# Option 1: Local MongoDB (Default)
# spring.data.mongodb.uri=mongodb://localhost:27017/driver_db
#
# Option 2: Docker Container (when running via docker-compose)
# spring.data.mongodb.uri=mongodb://admin:password@mongodb:27017/driver_db?authSource=admin
#
# Option 3: MongoDB Atlas Cloud Cluster (Paste your Atlas connection link here)
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/driver_db?retryWrites=true&w=majority
# ==============================================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/driver_db}
spring.data.mongodb.auto-index-creation=true

