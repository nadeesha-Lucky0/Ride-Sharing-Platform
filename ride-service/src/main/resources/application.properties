spring.application.name=ride-service
server.port=${SERVER_PORT:8083}

# ==============================================================================
# Member 3: MongoDB Configuration (Ride Service)
# ==============================================================================
# Option 1: Local MongoDB (Default)
# spring.data.mongodb.uri=mongodb://localhost:27017/ride_db
#
# Option 2: Docker Container (when running via docker-compose)
# spring.data.mongodb.uri=mongodb://admin:password@mongodb:27017/ride_db?authSource=admin
#
# Option 3: MongoDB Atlas Cloud Cluster (Paste your Atlas connection link here)
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/ride_db?retryWrites=true&w=majority
# ==============================================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ride_db}
spring.data.mongodb.auto-index-creation=true

# Inter-service URLs
services.account.url=${SERVICES_ACCOUNT_URL:http://localhost:8081}
services.driver.url=${SERVICES_DRIVER_URL:http://localhost:8082}
services.payment.url=${SERVICES_PAYMENT_URL:http://localhost:8084}

