spring.application.name=payment-service
server.port=${SERVER_PORT:8084}

# ==============================================================================
# Member 4: MongoDB Configuration (Payment Service)
# ==============================================================================
# Option 1: Local MongoDB (Default)
# spring.data.mongodb.uri=mongodb://localhost:27017/payment_db
#
# Option 2: Docker Container (when running via docker-compose)
# spring.data.mongodb.uri=mongodb://admin:password@mongodb:27017/payment_db?authSource=admin
#
# Option 3: MongoDB Atlas Cloud Cluster (SRV - Recommended)
# spring.data.mongodb.uri=mongodb+srv://it24102198_db_user:UwQUvrcWlIC62uep@payment-fare.a8vzjtg.mongodb.net/payment_db?retryWrites=true&w=majority&appName=Payment-Fare
#
# Option 4: MongoDB Atlas Cloud Cluster (Standard / Non-SRV Fallback)
# spring.data.mongodb.uri=mongodb://it24102198_db_user:UwQUvrcWlIC62uep@ac-5d7zz4j-shard-00-00.a8vzjtg.mongodb.net:27017,ac-5d7zz4j-shard-00-01.a8vzjtg.mongodb.net:27017,ac-5d7zz4j-shard-00-02.a8vzjtg.mongodb.net:27017/payment_db?ssl=true&replicaSet=atlas-11k3qt-shard-0&authSource=admin&appName=Payment-Fare
# ==============================================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://it24102198_db_user:UwQUvrcWlIC62uep@payment-fare.a8vzjtg.mongodb.net/payment_db?retryWrites=true&w=majority&appName=Payment-Fare}
spring.data.mongodb.auto-index-creation=true

# Fare Rules Defaults
app.fare.base-fare=50.0
app.fare.per-km-rate=15.0
app.fare.per-minute-rate=2.0
app.fare.surge-multiplier=1.0

